[pytest]
DJANGO_SETTINGS_MODULE = products.settings_test
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --strict-config --cov=assist --cov=orders --cov=catalog --cov=products --cov-report=term-missing
# Excecoes levantadas numa thread sem tratamento (ex.: o event loop do produtor
# Kafka) indicam um bug silencioso: falham a suite em vez de passar em silencio.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
