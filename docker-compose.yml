services:
  db:
    image: postgres:16-alpine
    container_name: synapseshop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapseshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: synapseshop-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    container_name: synapseshop-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:9094
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:9094
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "9094:9094"
      - "9644:9644"

  api:
    build: .
    container_name: synapseshop-api
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Assistente de IA (Aula 14)
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-5}
      LLM_RETRIES: ${LLM_RETRIES:-3}
      LLM_BACKOFF_BASE: ${LLM_BACKOFF_BASE:-0.5}
      LLM_BACKOFF_JITTER: ${LLM_BACKOFF_JITTER:-0.5}
      LLM_BACKOFF_MAXIMO: ${LLM_BACKOFF_MAXIMO:-5}
      LLM_CIRCUIT_FALHAS_PARA_ABRIR: ${LLM_CIRCUIT_FALHAS_PARA_ABRIR:-3}
      LLM_CIRCUIT_TIMEOUT_ABERTO: ${LLM_CIRCUIT_TIMEOUT_ABERTO:-30}
      LLM_PRECO_INPUT_1M: ${LLM_PRECO_INPUT_1M:-0.15}
      LLM_PRECO_OUTPUT_1M: ${LLM_PRECO_OUTPUT_1M:-0.60}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  worker:
    build: .
    command: ["sh", "-c", "python manage.py migrate && python manage.py consumir_pedido_criado"]
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MENSAGERIA_LOG_LEVEL: INFO
      MENSAGERIA_FORCAR_FALHA: ${MENSAGERIA_FORCAR_FALHA:-0}
    # nao serve HTTP: o HEALTHCHECK da imagem (porta 8000) nao se aplica
    healthcheck:
      disable: true
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      api:
        condition: service_started

  worker-notificacoes:
    build: .
    container_name: synapseshop-worker-notificacoes
    command: ["sh", "-c", "python manage.py migrate && python manage.py consumir_pagamento"]
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
      REDIS_URL: redis://redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MENSAGERIA_LOG_LEVEL: INFO
      MENSAGERIA_FORCAR_FALHA: ${MENSAGERIA_FORCAR_FALHA:-0}
    # nao serve HTTP: o HEALTHCHECK da imagem (porta 8000) nao se aplica
    healthcheck:
      disable: true
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      api:
        condition: service_started

  inventory:
    build:
      context: inventory
    container_name: inventory
    environment:
      APP_NAME: synapseshop-inventory
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata: