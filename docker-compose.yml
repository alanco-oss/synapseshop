services:
  db:
    image: postgres:16-alpine
    container_name: synapseshop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapseshop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: synapseshop-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  inventory:
    build:
      context: inventory
    container_name: inventory
    environment:
      APP_NAME: synapseshop-inventory
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapseshop}
      POSTGRES_DB: ${POSTGRES_DB:-synapseshop}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata: